name: Repair credit-only AI settings
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore admin settings safely
        run: python3 scripts/repair-credit-policy.py
      - name: Commit repair and remove one-shot files
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/features/admin/settings/PlatformSettingsForm/index.tsx scripts/repair-credit-policy.py
          git commit -m "fix: restore admin settings after AI quota cleanup"
          git push
          git rm -f .github/workflows/ai-credit-only-v1.yml .github/workflows/ai-credit-only-v2.yml .github/workflows/ai-credit-only-v3.yml .github/workflows/ai-credit-only-v3.yml .github/workflows/apply-credit-only-policy.yml .github/workflows/repair-credit-policy.yml scripts/apply-credit-only-policy.py scripts/repair-credit-policy.py || true
          git commit -m "chore: remove temporary AI policy scripts and workflows" || true
          git push
