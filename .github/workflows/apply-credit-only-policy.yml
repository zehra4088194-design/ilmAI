name: Apply credit-only AI policy
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply policy
        run: python3 scripts/apply-credit-only-policy.py
      - name: Commit policy changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/rate-limit/index.ts src/lib/platform-settings/shared.ts src/components/features/admin/settings/PlatformSettingsForm/index.tsx scripts/apply-credit-only-policy.py
          git commit -m "feat: make AI usage credit-only" || exit 0
          git push
