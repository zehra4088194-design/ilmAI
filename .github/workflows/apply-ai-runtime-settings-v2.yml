name: Apply AI runtime settings wiring v2

on:
  push:
    paths:
      - '.github/ai-runtime-patch-v2.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime wiring
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, got {count}: {pattern[:160]!r}')
              p.write_text(new, encoding='utf-8')

          replace_once(
              'src/lib/ai/gateway.ts',
              r"import type \{ ProviderBudgetKey \} from '@/lib/platform-settings/shared';\n",
              "import type { ProviderBudgetKey } from '@/lib/platform-settings/shared';\nimport { getAiRuntimeSettings } from '@/lib/ai/runtime-settings';\n",
          )
          replace_once(
              'src/lib/ai/gateway.ts',
              r"  const res = await fetch\(`\$\{GATEWAY_URL\}\$\{path\}`, \{\n",
              "  const requestBody: any = body && typeof body === 'object' ? { ...(body as Record<string, unknown>) } : body;\n  if (requestBody && typeof requestBody === 'object') {\n    const runtime = await getAiRuntimeSettings();\n    const selectedProvider = provider === ADVANCED_GATEWAY_PROVIDER ? 'openrouter' : provider;\n    if (selectedProvider === 'groq' || selectedProvider === 'gemini' || selectedProvider === 'openrouter') {\n      const selection = runtime[selectedProvider];\n      requestBody.key_mode = selection.mode;\n      requestBody.key_number = selection.keyNumber;\n    }\n  }\n\n  const res = await fetch(`${GATEWAY_URL}${path}`, {\n",
          )
          replace_once(
              'src/lib/ai/gateway.ts',
              r"    body: JSON\.stringify\(body\),",
              "    body: JSON.stringify(requestBody),",
          )

          replace_once(
              'services/ai-gateway/handler.mjs',
              r"\* OPENROUTER_API_KEY -> ONE OpenRouter key\. It serves the free router first and\n \*                       retries on DeepSeek V4 Flash only if that call fails\.\n \*                       No pool, no JSON, no rotation for this provider\.\n",
              "* OPENROUTER_API_KEY_1..10 -> ten-key OpenRouter pool (legacy single OPENROUTER_API_KEY\n *                       and OPENROUTER_API_KEYS_JSON remain supported). Rotation is the default;\n *                       the app can request one fixed key number per provider.\n",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"\(prefix === 'GROQ_API_KEY' \|\| prefix === 'GEMINI_API_KEY'\) && numberedKeys\.length",
              "(prefix === 'GROQ_API_KEY' || prefix === 'GEMINI_API_KEY' || prefix === 'OPENROUTER_API_KEY') && numberedKeys.length",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"/\*\*\n \* Reserves the next provider key before its network request starts\.\n",
              "/** Selects either the admin-fixed key or the normal round-robin pool. Fixed mode\n * intentionally never falls through to another key, so the admin choice is strict. */\nasync function withSelectedKey(keys, callFn, label, mode = 'rotation', keyNumber = 1, maxAttempts = DEFAULT_KEY_ATTEMPTS, cursorKey = label) {\n  if (mode === 'fixed') {\n    const index = Math.max(1, Math.min(10, Number(keyNumber) || 1)) - 1;\n    if (!keys[index]) return { ok: false, error: `${label} fixed key #${index + 1} is not configured` };\n    try {\n      const result = await callFn(keys[index]);\n      if (result.ok && (!(typeof result.data === 'string') || result.data.trim())) {\n        return { ...result, keyIndexUsed: index + 1 };\n      }\n      return { ok: false, error: result.error || `${label} key #${index + 1} failed`, status: result.status || 502 };\n    } catch (error) {\n      return { ok: false, error: `${label} key #${index + 1} network error: ${error?.message || 'unknown error'}`, status: 503 };\n    }\n  }\n  return withKeyRotation(keys, callFn, label, maxAttempts, cursorKey);\n}\n\n/**\n * Reserves the next provider key before its network request starts.\n",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"async function withOpenRouterFallback\(env, messages, maxTokens, temperature\) \{[\s\S]*?\n\}\n\nfunction parseGeminiDocumentPayload",
              "async function withOpenRouterFallback(env, messages, maxTokens, temperature, keyMode = 'rotation', keyNumber = 1) {\n  const keys = getKeys(env, 'OPENROUTER_API_KEY');\n  if (!keys.length) return { ok: false, error: 'No keys configured for OpenRouter (set OPENROUTER_API_KEY_1..10)' };\n\n  const callChain = async (key) => {\n    let lastError = null;\n    for (const model of OPENROUTER_CHAIN) {\n      try {\n        const result = await callOpenRouter(key, model, messages, maxTokens, temperature);\n        if (result.ok && String(result.data || '').trim()) return { ok: true, data: result.data, modelUsed: model };\n        lastError = result.error || `OpenRouter ${model} returned an empty response`;\n      } catch (error) {\n        lastError = `OpenRouter ${model} network error: ${error?.message || 'unknown error'}`;\n      }\n    }\n    return { ok: false, error: `OpenRouter free router and DeepSeek fallback both failed. Last error: ${lastError}`, status: 502 };\n  };\n\n  return withSelectedKey(keys, callChain, 'OpenRouter', keyMode, keyNumber, DEFAULT_KEY_ATTEMPTS, 'openrouter');\n}\n\nfunction parseGeminiDocumentPayload",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"    strict_provider = false,\n",
              "    strict_provider = false,\n    key_mode = 'rotation',\n    key_number = 1,\n",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  \} else if \(provider === 'groq'\) \{\n    result = await withKeyRotation\([\s\S]*?\n    \);\n  \} else if \(provider === 'grok'\) \{",
              "  } else if (provider === 'groq') {\n    result = await withSelectedKey(\n      getKeys(env, 'GROQ_API_KEY'),\n      (k) => callGroq(k, model, messages, max_tokens, temperature),\n      'Assistant',\n      key_mode,\n      key_number,\n      DEFAULT_KEY_ATTEMPTS,\n      'groq'\n    );\n  } else if (provider === 'grok') {",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  \} else if \(provider === 'gemini'\) \{\n    result = await withKeyRotation\([\s\S]*?\n    \);\n  \} else if \(provider === 'deepseek'\) \{",
              "  } else if (provider === 'gemini') {\n    result = await withSelectedKey(\n      getKeys(env, 'GEMINI_API_KEY'),\n      (k) => callGemini(k, model, messages, max_tokens),\n      'Gemini',\n      key_mode,\n      key_number,\n      DEFAULT_KEY_ATTEMPTS,\n      'gemini'\n    );\n  } else if (provider === 'deepseek') {",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  \} else if \(provider === 'openrouter'\) \{\n    result = await withOpenRouterFallback\(env, messages, max_tokens, temperature\);",
              "  } else if (provider === 'openrouter') {\n    result = await withOpenRouterFallback(env, messages, max_tokens, temperature, key_mode, key_number);",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  const body = await req\.json\(\);\n  const \{\n    imageBase64,",
              "  const body = await req.json();\n  const {\n    imageBase64,\n    key_mode = 'rotation',\n    key_number = 1,",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  const result = await withKeyRotation\(\n    geminiKeys,\n    \(key\) => callGeminiDocument\(key, imageBase64, mimeType, \{ includeSummary, documentType, language \}\),\n    'Gemini document scan',\n    DEFAULT_KEY_ATTEMPTS,\n    'gemini'\n  \);",
              "  const result = await withSelectedKey(\n    geminiKeys,\n    (key) => callGeminiDocument(key, imageBase64, mimeType, { includeSummary, documentType, language }),\n    'Gemini document scan',\n    key_mode,\n    key_number,\n    DEFAULT_KEY_ATTEMPTS,\n    'gemini'\n  );",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  const body = await req\.json\(\)\.catch\(\(\) => \(\{\}\)\);\n  const \{ subject \} = body;",
              "  const body = await req.json().catch(() => ({}));\n  const { subject, key_mode = 'rotation', key_number = 1 } = body;",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"  const result = await withKeyRotation\(\n    getKeys\(env, 'GEMINI_API_KEY'\),\n    \(k\) => mintEphemeralToken\(k, model, systemInstruction\),\n    'Gemini Live Token',\n    DEFAULT_KEY_ATTEMPTS,\n    'gemini'\n  \);",
              "  const result = await withSelectedKey(\n    getKeys(env, 'GEMINI_API_KEY'),\n    (k) => mintEphemeralToken(k, model, systemInstruction),\n    'Gemini Live Token',\n    key_mode,\n    key_number,\n    DEFAULT_KEY_ATTEMPTS,\n    'gemini'\n  );",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"provider === 'openrouter' \? \(env\.OPENROUTER_API_KEY \? 1 : 0\) : getKeys\(env, prefix\)\.length",
              "getKeys(env, prefix).length",
          )
          replace_once(
              'services/ai-gateway/handler.mjs',
              r"openrouter: Boolean\(env\.OPENROUTER_API_KEY\),",
              "openrouter: getKeys(env, 'OPENROUTER_API_KEY').length > 0,",
          )
          replace_once(
              'src/app/api/whatsapp/ai-reply/route.ts',
              r"import \{ gatewayChat, GatewayError \} from '@/lib/ai/gateway';\n",
              "import { gatewayChat, GatewayError } from '@/lib/ai/gateway';\nimport { getAiRuntimeSettings } from '@/lib/ai/runtime-settings';\n",
          )
          replace_once(
              'src/app/api/whatsapp/ai-reply/route.ts',
              r"      const result = await gatewayChat\(\{\n        provider: 'groq',\n        tier: 'mini',",
              "      const whatsappSettings = await getAiRuntimeSettings();\n      const result = await gatewayChat({\n        provider: whatsappSettings.whatsapp.provider,\n        tier: whatsappSettings.whatsapp.tier,",
          )
          replace_once(
              'src/app/api/whatsapp/ai-reply/route.ts',
              r"the existing AI gateway \(Groq, mini tier — same key-rotation/budget infra every other AI",
              "the existing AI gateway (admin-selected provider/tier — same key-rotation/budget infra every other AI",
          )

          Path('.github/ai-runtime-patch-v2.trigger').unlink()
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/gateway.ts services/ai-gateway/handler.mjs src/app/api/whatsapp/ai-reply/route.ts .github/ai-runtime-patch-v2.trigger
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce admin AI key selection and WhatsApp model"
          git push
