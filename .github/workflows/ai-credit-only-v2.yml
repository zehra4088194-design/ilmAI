name: Apply credit-only AI quota policy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) rate-limit: remove all user-facing AI quota walls except the shared wallet.
          p = Path('src/lib/rate-limit/index.ts')
          s = p.read_text()

          old = """export function getAiDailyLimit(tier: SubscriptionTier, _feature: 'side_chat' | 'tool' = 'tool') {
  if (tier === 'ELITE') return AI_DAILY_LIMITS.ELITE_TOOL;
  if (tier === 'PRO') return AI_DAILY_LIMITS.PRO_TOOL;
  return AI_DAILY_LIMITS.FREE_TOOL;
}"""
          new = """export function getAiDailyLimit(_tier: SubscriptionTier, _feature: 'side_chat' | 'tool' = 'tool') {
  // Legacy compatibility helper. AI access is governed only by the shared credit wallet.
  return -1;
}"""
          if old not in s:
              raise SystemExit('getAiDailyLimit anchor missing')
          s = s.replace(old, new, 1)

          old = """return `You have used all free weekly credits for ${featureLabel}. Pro includes ${pro.limits.aiCreditsMonthly} per month, up to ${pro.limits.aiCreditsDaily} per day.`;"""
          new = """return `You have used all free weekly credits for ${featureLabel}. Pro includes ${pro.limits.aiCreditsMonthly} shared credits per month.`;"""
          if old in s:
              s = s.replace(old, new, 1)

          start = s.find('export async function checkModelTierLimit(')
          end = s.find('export async function checkParentAttachmentLimits', start)
          if start < 0 or end < 0:
              raise SystemExit('checkModelTierLimit boundaries missing')
          replacement = """export async function checkModelTierLimit(
  _userId: string,
  _provider: string,
  _modelTier: 'mini' | 'medium' | 'pro',
  _userTier: SubscriptionTier = 'PRO'
) {
  // Model tier never has a separate quota. The shared AI credit wallet is authoritative.
  return { success: true, remaining: -1, reset: 0 };
}

"""
          s = s[:start] + replacement + s[end:]

          start = s.find('export async function checkPresentationLimit(')
          end = s.find('// File Summary / File Test tools:', start)
          if start < 0 or end < 0:
              raise SystemExit('checkPresentationLimit boundaries missing')
          replacement = """export async function checkPresentationLimit(
  userId: string,
  tier: SubscriptionTier,
  _slideCount: number
) {
  const audience = (await getAudiencePlanLimits(userId, tier)).audience;
  // Presentation generation is limited only by the shared AI credits it consumes.
  return {
    success: true,
    remaining: -1,
    reset: 0,
    maxSlides: Number.MAX_SAFE_INTEGER,
    audience,
  };
}

"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 2) Admin settings: remove legacy AI-only controls; leave non-AI quotas editable.
          p = Path('src/components/features/admin/settings/PlatformSettingsForm/index.tsx')
          s = p.read_text()
          s = s.replace("  BookOpenCheck, DollarSign, GraduationCap, Mail, Moon, Presentation, Printer, Save, ShieldCheck, Sun, UserRoundCog, Users", "  BookOpenCheck, DollarSign, GraduationCap, Mail, Moon, Printer, Save, ShieldCheck, Sun, UserRoundCog, Users")
          s = s.replace("  ['aiCreditsDaily', 'Shared AI/day'],\n", "")
          s = s.replace("  ['premiumAiMonthly', 'Premium AI/month'],\n", "")
          s = s.replace(
              "Change Free, Pro, and Elite prices, daily/weekly usage limits, downloads, and feature toggles here.",
              "Change plan prices and non-AI feature limits here. AI usage comes from one shared credit pool."
          )

          # Remove any NumberField whose label mentions AI credits. These controls are not valid
          # user entitlements anymore; the subscription plan's shared credit wallet is the source.
          s = re.sub(
              r'\n\s*<NumberField\b(?=[\s\S]*?label=[\"\'][^\"\']*AI credits[^\"\']*[\"\'])[^/]*/>\n',
              '\n',
              s,
              flags=re.IGNORECASE,
          )

          # Remove the whole Presentation Builder audience card by its heading text, preserving
          # the rest of the settings page structure.
          heading = 'Presentation Builder, by audience'
          pos = s.find(heading)
          if pos >= 0:
              card_start = s.rfind('<Card', 0, pos)
              card_end = s.find('</Card>', pos)
              if card_start >= 0 and card_end >= 0:
                  s = s[:card_start] + s[card_end + len('</Card>'):]

          p.write_text(s)

          # 3) Keep legacy stored values harmless: never let old settings make a new AI wall active.
          p = Path('src/lib/platform-settings/shared.ts')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*)aiCreditsDaily: numberOrFallback\([^\n]*\),$', r'\1aiCreditsDaily: -1,', s)
          s = re.sub(r'(?m)^(\s*)premiumAiMonthly: numberOrFallback\([^\n]*\),$', r'\1premiumAiMonthly: -1,', s)
          p.write_text(s)
          PY

          if grep -n "Shared AI/day\|Premium AI/month" src/components/features/admin/settings/PlatformSettingsForm/index.tsx; then
            echo 'Legacy AI controls still present'
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rate-limit/index.ts src/lib/platform-settings/shared.ts src/components/features/admin/settings/PlatformSettingsForm/index.tsx
          git commit -m "feat: make AI usage credit-only"
          git push

          # Remove both one-shot patch workflows after the real changes are committed.
          git rm -f .github/workflows/ai-credit-only-v1.yml .github/workflows/ai-credit-only-v2.yml || true
          git commit -m "chore: remove one-shot AI quota workflows" || true
          git push
