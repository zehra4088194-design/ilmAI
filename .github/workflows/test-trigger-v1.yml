name: move-ai-settings-v1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move AI settings cards
        run: node .github/move_ai_settings.js
      - name: Verify and cleanup
        run: |
          grep -q "AI routing by module" 'src/app/(admin)/admin/ai-api-keys/page.tsx'
          ! grep -q "Free Provider Safety Budgets" 'src/components/features/admin/settings/PlatformSettingsForm/index.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/features/admin/settings/PlatformSettingsForm/index.tsx 'src/app/(admin)/admin/ai-api-keys/page.tsx'
          git commit -m "feat: move AI budgets and routing into AI API keys"
          git rm .github/workflows/test-trigger-v1.yml .github/workflows/move-ai-settings-v3.yml .github/move_ai_settings.js .github/ai-settings-migration-trigger.txt
          git commit -m "chore: remove temporary AI settings migration files"
          git push origin main
