name: Apply school communication wiring
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              s = p.read_text()
              n = transform(s)
              if n == s:
                  raise SystemExit(f'No change made to {path}; patch anchor missing')
              p.write_text(n)

          # Save the optional quick-add details to the persistent school record.
          edit('src/lib/school-erp/actions.ts', lambda s: s.replace(
              "import { sendImmediateAttendanceAlerts } from '@/lib/school-erp/notification-queue';\n",
              "import { sendImmediateAttendanceAlerts } from '@/lib/school-erp/notification-queue';\nimport { saveSchoolStudentRecord, studentRecordFromForm } from '@/lib/school-erp/student-record';\n"
          ))
          edit('src/lib/school-erp/actions.ts', lambda s: s.replace(
              "    await createEnrollmentRecord(db, context, {\n      profileId: profile.id,\n      sectionId,\n      academicYearId,\n      admissionNumber,\n      rollNumber: optionalText(formData, 'roll_number'),\n    });\n    return done(",
              "    await createEnrollmentRecord(db, context, {\n      profileId: profile.id,\n      sectionId,\n      academicYearId,\n      admissionNumber,\n      rollNumber: optionalText(formData, 'roll_number'),\n    });\n    const recordInput = studentRecordFromForm(formData);\n    const studentPhotoFile = formData.get('student_photo');\n    if (studentPhotoFile instanceof File && studentPhotoFile.size > 0) {\n      if (!studentPhotoFile.type.startsWith('image/')) throw new Error('Student photo must be an image file.');\n      recordInput.photo_url = await uploadStudentPhoto(db, context.organization.id, studentPhotoFile);\n    }\n    await saveSchoolStudentRecord(db, context.organization.id, profile.id, recordInput);\n    return done("
          ))

          # Make completed self-service records return directly to the school portal.
          edit('src/lib/school-erp/student-record.ts', lambda s: s.replace(
              "  await saveSchoolStudentRecord(supabase as any, context.organization.id, studentId, input);\n  return { success: true, complete: isStudentRecordComplete(input) };",
              "  const saved = await saveSchoolStudentRecord(supabase as any, context.organization.id, studentId, input);\n  if (saved.is_profile_complete && studentId === user.id) redirect('/school');\n  return { success: true, complete: saved.is_profile_complete };"
          ))

          # Expand quick-add with optional complete-now fields. Blank means the new student is sent
          # through the mandatory /school/complete-profile flow; filled fields make the record complete.
          def quick_add(s):
              old = '''            <SchoolActionForm\n              action={enrollStudent}\n              submitLabel="Add student"\n              className="grid gap-3 md:grid-cols-3"\n            >\n              <Input name="student_name" placeholder="Student's full name" />\n              <Input name="student_email" type="email" placeholder="Their email address" required />\n              <select name="section_id" className={selectClass} required>\n                <option value="">Class / section</option>\n                {people.sections.map((item: any) => (\n                  <option key={item.id} value={item.id}>\n                    {item.school_classes?.name} - {item.name}\n                  </option>\n                ))}\n              </select>\n            </SchoolActionForm>\n            <p className="text-muted-foreground mt-3 text-xs">\n              That&apos;s it — they get an email to set a password and complete the rest of their own profile\n              (grade, board, photo, etc). Academic year is picked automatically, and the admission number too —\n              see People if you need to set a roll number or other details later.\n            </p>'''
              new = '''            <SchoolActionForm\n              action={enrollStudent}\n              submitLabel="Add student"\n              className="space-y-4"\n            >\n              <div className="grid gap-3 md:grid-cols-3">\n                <Input name="student_name" placeholder="Student's full name" />\n                <Input name="student_email" type="email" placeholder="Their email address" required />\n                <select name="section_id" className={selectClass} required>\n                  <option value="">Class / section</option>\n                  {people.sections.map((item: any) => (\n                    <option key={item.id} value={item.id}>\n                      {item.school_classes?.name} - {item.name}\n                    </option>\n                  ))}\n                </select>\n              </div>\n              <details className="rounded-xl border p-3">\n                <summary className="cursor-pointer text-sm font-semibold">Complete student record now (optional)</summary>\n                <div className="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">\n                  <Input name="b_form_number" placeholder="B-Form number" />\n                  <Input name="father_cnic" placeholder="Father's CNIC number" />\n                  <Input name="matric_total_marks" type="number" placeholder="Matric total marks" />\n                  <Input name="matric_obtained_marks" type="number" placeholder="Matric obtained marks" />\n                  <Input name="matric_year" type="number" placeholder="Matric year" />\n                  <Input name="date_of_birth" type="date" />\n                  <Input name="gender" placeholder="Gender" />\n                  <Input name="blood_group" placeholder="Blood group" />\n                  <Input name="student_phone" placeholder="Student phone" />\n                  <Input name="address" placeholder="Home address" />\n                  <Input name="city" placeholder="City" />\n                  <Input name="guardian_name" placeholder="Guardian name" />\n                  <Input name="guardian_phone" placeholder="Guardian phone" />\n                  <Input name="guardian_relationship" placeholder="Guardian relationship" />\n                  <Input name="emergency_contact_name" placeholder="Emergency contact name" />\n                  <Input name="emergency_contact_phone" placeholder="Emergency contact phone" />\n                  <Input name="previous_school" placeholder="Previous school" />\n                  <Input name="nationality" placeholder="Nationality" />\n                  <Input name="religion" placeholder="Religion" />\n                  <label className="flex flex-col gap-1 text-xs sm:col-span-2 lg:col-span-1">Student photo<input name="student_photo" type="file" accept="image/*" className="text-sm" /></label>\n                </div>\n              </details>\n            </SchoolActionForm>\n            <p className="text-muted-foreground mt-3 text-xs">\n              Leave the record blank for now and the student will be required to complete the missing school details before entering the school portal. If you fill everything here, they go straight in.\n            </p>'''
              if old not in s: raise SystemExit('quick-add anchor missing')
              return s.replace(old, new)
          edit('src/app/school-admin/page.tsx', quick_add)

          # Enforce completion only for quick-added students that have a school_student_records row.
          edit('src/app/school/page.tsx', lambda s: s.replace(
              "import { getStudentKidsZoneEligibility } from '@/lib/school-erp/kids-zone';\n",
              "import { getStudentKidsZoneEligibility } from '@/lib/school-erp/kids-zone';\nimport { getOwnSchoolStudentRecord } from '@/lib/school-erp/student-record';\n"
          ).replace(
              "  const role = context.membership.member_role;\n",
              "  const role = context.membership.member_role;\n  if (role === 'student') {\n    const studentRecord = await getOwnSchoolStudentRecord(context.organization.id);\n    if (studentRecord && !studentRecord.is_profile_complete) redirect('/school/complete-profile');\n  }\n"
          ))

          # Add communication links to each persona's sidebar and to consumer Study navigation.
          def sidebar(s):
              s = s.replace(
                  "{ icon: MessageCircle, label: 'Study Buddies', href: '/student-chat', badge: 'Pro' },",
                  "{ icon: MessageCircle, label: 'Study Buddies', href: '/student-chat', badge: 'Pro' },\n      { icon: MessageCircle, label: 'Messages', href: '/messages' },\n      { icon: Phone, label: 'Calls', href: '/calls' },"
              )
              # Add Phone import if not already present.
              if "  Phone," not in s:
                  s = s.replace("  LayoutDashboard, BookOpen, Brain, FileText, TrendingUp, Trophy, Settings,", "  LayoutDashboard, BookOpen, Brain, FileText, TrendingUp, Trophy, Settings, Phone,")
              link = '''              <Link href="/messages" onClick={() => { rememberSidebarScroll(); setMobileOpen(false); }} className={cn('flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 group', isActive('/messages') ? 'bg-sidebar-accent text-sidebar-accent-foreground' : 'text-sidebar-foreground/60 hover:bg-sidebar-accent/50 hover:text-sidebar-foreground')}><MessageCircle className="w-4 h-4 shrink-0 text-sidebar-foreground/40" /><span className="flex-1">Messages</span></Link>\n              <Link href="/calls" onClick={() => { rememberSidebarScroll(); setMobileOpen(false); }} className={cn('flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 group', isActive('/calls') ? 'bg-sidebar-accent text-sidebar-accent-foreground' : 'text-sidebar-foreground/60 hover:bg-sidebar-accent/50 hover:text-sidebar-foreground')}><Phone className="w-4 h-4 shrink-0 text-sidebar-foreground/40" /><span className="flex-1">Calls</span></Link>\n'''
              for label in ['Parent Portal', 'Teacher Portal', 'Principal Portal']:
                  marker = f'<p className="text-[10px] font-bold uppercase tracking-widest text-sidebar-foreground/30 px-2 mb-1.5">{label}</p>'
                  if marker in s:
                      s = s.replace(marker, marker + link, 1)
              return s
          edit('src/components/layout/DashboardSidebar/index.tsx', sidebar)

          # Calls page should query history directly with the authenticated server context rather than
          # making a server-to-server fetch that cannot carry the browser cookie.
          edit('src/app/calls/page.tsx', lambda s: s.replace(
              "import { requireSchoolContext } from '@/lib/school-erp/access';\n",
              "import { requireSchoolContext } from '@/lib/school-erp/access';\nimport { createAdminClient } from '@/lib/supabase/server';\n"
          ).replace(
              "  const res = await fetch(`${process.env.NEXT_PUBLIC_APP_URL || ''}/api/school-communication/call-history`, { headers: { cookie: '' }, cache: 'no-store' }).catch(() => null);\n  const history = res && res.ok ? (await res.json()).calls || [] : [];",
              "  const admin = await createAdminClient();\n  const adminDb = admin as any;\n  let historyQuery = adminDb.from('school_call_logs').select('id, caller_id, callee_id, status, started_at, ended_at').eq('organization_id', context.organization.id).order('started_at', { ascending: false }).limit(100);\n  if (!['owner', 'admin'].includes(context.membership.member_role)) historyQuery = historyQuery.or(`caller_id.eq.${context.userId},callee_id.eq.${context.userId}`);\n  const { data: historyRows } = await historyQuery;\n  const historyIds = Array.from(new Set((historyRows || []).flatMap((row: any) => [row.caller_id, row.callee_id])));\n  const { data: historyProfiles } = historyIds.length ? await adminDb.from('profiles').select('id, full_name').in('id', historyIds) : { data: [] };\n  const historyById = new Map((historyProfiles || []).map((p: any) => [p.id, p]));\n  const history = (historyRows || []).map((row: any) => ({ ...row, caller: historyById.get(row.caller_id) || null, callee: historyById.get(row.callee_id) || null }));"
          ))

          # Student record schema needs father name as well; keep it extensible without breaking existing rows.
          # This is handled by the separate migration committed earlier; no action required here.
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git commit -m "feat: wire school communication UI and student completion" || exit 0
          git push

          # Remove the one-shot workflow so future normal pushes are unaffected.
          git rm -f .github/workflows/apply-school-communication-v1.yml
          git commit -m "chore: remove one-shot communication patch workflow"
          git push
