name: Fix study buddies desktop layout
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/features/student-chat/StudentChatClient/index.tsx')
          s = p.read_text()
          s = s.replace('grid gap-6 xl:grid-cols-[1fr,360px]', 'grid gap-6 lg:grid-cols-[minmax(0,1fr),360px]')
          s = s.replace('xl:order-2', 'lg:order-2 lg:sticky lg:top-20 lg:self-start')
          s = s.replace('xl:order-1', 'lg:order-1')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/features/student-chat/StudentChatClient/index.tsx
          git commit -m "fix: place study buddy list in right desktop rail" || exit 0
          git push
          git rm -f .github/workflows/fix-study-buddies-layout.yml
          git commit -m "chore: remove one-shot layout workflow"
          git push
