name: Scheduled maintenance

on:
  schedule:
    # 12:01 AM Pakistan time (UTC+5)
    - cron: '1 19 * * *'
    # 1:00 PM Pakistan time (UTC+5)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled app jobs
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          # GitHub Actions runs `shell: bash` steps with `-e` by default, so a
          # bare failed `test` here aborts the whole step in under a second
          # with no explanation — every cron job below silently never runs.
          # Fail loud with the actual cause instead: this almost always means
          # the APP_URL / CRON_SECRET repository secrets (Settings -> Secrets
          # and variables -> Actions) are missing or empty.
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL repository secret is not set — add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — add it in Settings > Secrets and variables > Actions (must match the app's CRON_SECRET env var)."
            exit 1
          fi

          # Each job must run independently — one failing (5xx, timeout, etc.)
          # must not stop the rest of the batch from being called at all.
          call_job() {
            if ! curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}$1"; then
              echo "::warning::cron job $1 failed"
            fi
          }

          call_job /api/cron/resource-context
          call_job /api/cron/school-notifications
          call_job /api/cron/usd-pkr-rate
          call_job /api/cron/expire-institution-trials
          # Only twice/day here (this workflow's own schedule) vs. the ~2-minute cadence the
          # self-hosted services/cron container runs it at — biometric attendance will lag on
          # the free-hosted deployment, but still syncs instead of never running at all.
          call_job /api/cron/biometric-attendance-sync

          day=$(date -u +%u)
          time=$(date -u +%H:%M)
          case "$day:$time" in
            1:00:00) call_job /api/cron/weekly-snapshots ;;
            1:00:10) call_job /api/cron/weekly-league-rollover ;;
          esac

          case "$time" in
            01:00) call_job /api/cron/student-predictions ;;
            02:30) call_job /api/cron/daily-study-emails ;;
            03:00) call_job /api/cron/weak-subjects ;;
            04:00) call_job /api/cron/study-reminders ;;
            04:30) call_job /api/cron/storage-cleanup ;;
          esac
